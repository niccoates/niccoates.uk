                </p>

                <form id="contactForm">
                    <label>
                        Name
                        <input type="text" name="name" required />
                    </label>

                        Email address

                    </label>

                    <label>
                        Contact number
                        <input type="tel" name="phone" />
                    </label>

                    <label>
                        How can I help?
                        <textarea name="message" rows="4" required></textarea>
                    </label>

                    <button type="submit">Send message</button>
                </form>
